    <text x="780" y="636" font-size="18" fill="#1D2430">Δγ：终点中雨 +0.014、<tspan x="780" dy="26">大雨 +0.017、暴雨 +0.018</tspan></text>
  </g>
  <g id="crossover-note" data-pptx-bounds="1020 532 204 144">
    <rect x="1020" y="540" width="4" height="124" fill="#D9622B" />
    <text x="1036" y="564" font-size="18" fill="#1D2430">起点暴雨 +0.030<tspan x="1036" dy="28">&gt;1000 km 衰减变平：</tspan><tspan x="1036" dy="28">交叉尺度？</tspan><tspan x="1036" dy="28">（高铁 / 航空接管）</tspan></text>
  </g>
