  </g>
  <line id="band-rule" data-pptx-role="decoration" x1="72" y1="522" x2="1224" y2="522" stroke="#D5DAE0" stroke-width="1" />
  <g id="gravity-formula" data-pptx-replace-with="formula" data-pptx-x="72" data-pptx-y="532" data-pptx-width="460" data-pptx-height="64" data-pptx-bounds="72 532 460 64">
    <metadata type="application/json">
      {"latex":"F_{ij} \\propto M_i^{\\alpha} M_j^{\\beta} d_{ij}^{-\\gamma}, \\quad \\gamma_{\\mathrm{rain}} = \\gamma - \\Delta\\gamma",
       "display":"block","font_size":24,"color":"#1F3A5F","align":"left"}
    </metadata>
    <text x="72" y="572" font-size="24" fill="#1F3A5F">Fᵢⱼ ∝ Mᵢᵅ Mⱼᵝ dᵢⱼ⁻ᵞ,   γ_rain = γ − Δγ</text>
  </g>
  <g id="gravity-notes" data-pptx-bounds="72 604 448 72" font-size="18">
    <text x="72" y="626" fill="#1D2430">质量版：F ∝ M<tspan baseline-shift="sub" font-size="14">i</tspan><tspan baseline-shift="super" font-size="14">0.59</tspan> M<tspan baseline-shift="sub" font-size="14">j</tspan><tspan baseline-shift="super" font-size="14">0.58</tspan> d<tspan baseline-shift="super" font-size="14">−1.51</tspan></text>
    <text x="72" y="656" fill="#5B6573">Δγ = 降雨效应对 ln d 的斜率</text>
  </g>
  <g id="hero-gamma" data-pptx-bounds="540 532 232 144">
    <text x="540" y="600" font-size="64" font-weight="bold" fill="#1F3A5F">2.13</text>
    <text x="540" y="636" font-size="18" fill="#1D2430">γ：去掉起终点固定<tspan x="540" dy="26">效应后的距离衰减指数</tspan></text>
  </g>
  <g id="hero-delta" data-pptx-bounds="780 532 236 144">
