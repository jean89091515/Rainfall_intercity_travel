    <text x="88" y="614" font-size="20" fill="#1D2430"><tspan font-weight="bold" fill="#D9622B">物理视角：</tspan>损失来自频繁的小扰动，仅中雨就是暴雨 + 大暴雨的约 6 倍 → Q7</text>
