    <path d="M13 14l-2 4l3 0l-2 4" />
  </g>
    <text x="992" y="198" font-size="24" font-weight="bold" fill="#1D2430">IBTrACS</text>
    <text x="944" y="236" font-size="18" fill="#5B6573">热带气旋路径 · 辅助</text>
    <text fill="#1D2430" font-size="20" x="944" y="280">西北太平洋路径</text><text fill="#1D2430" font-size="20" x="944" y="312">3 小时一个位置</text><text fill="#1D2430" font-size="20" x="944" y="344">气旋中心（含残余低压）</text><text fill="#1D2430" font-size="20" x="944" y="376">距城市 ≤ 500 km</text><text fill="#1D2430" font-size="20" x="944" y="408">→ 记为台风日</text><rect x="944" y="540" width="4" height="96" fill="#2E7FB8" />
    <text x="962" y="562" font-size="18" font-weight="bold" fill="#2E7FB8">稳健性</text>
    <text fill="#1D2430" font-size="18" x="962" y="592">半径改为 300 km</text><text fill="#1D2430" font-size="18" x="962" y="620">结果基本不变</text></g>
