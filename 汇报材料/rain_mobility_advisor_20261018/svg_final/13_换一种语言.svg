  <g id="section-label" data-pptx-bounds="72 40 640 30">
    <text x="72" y="62" font-size="18" font-weight="bold" fill="#2E7FB8">03 用统计物理语言重看</text>
  </g>
  <g id="page-title" data-pptx-bounds="72 76 1152 56">
    <text x="72" y="112" font-size="38" font-weight="bold" fill="#1F3A5F">换一种语言：把降雨看成一个弱而普遍的外场</text>
  </g>
  <rect id="definition-field" data-pptx-role="decoration" x="72" y="160" width="440" height="460" fill="#F3F5F7" />
