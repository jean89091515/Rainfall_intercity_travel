    <text x="96" y="204" font-size="18" font-weight="bold" fill="#2E7FB8">定义</text>
  </g>
  <g id="susceptibility-formula" data-pptx-replace-with="formula" data-pptx-x="96" data-pptx-y="224" data-pptx-width="392" data-pptx-height="110" data-pptx-bounds="96 224 392 110">
    <metadata type="application/json">
      {"latex":"\\chi = \\frac{\\partial \\langle \\ln F \\rangle}{\\partial h}",
       "display":"block","font_size":40,"color":"#1F3A5F","align":"left"}
    </metadata>
    <text x="96" y="294" font-size="40" fill="#1F3A5F">χ = ∂⟨ln F⟩ / ∂h</text>
  </g>
  <g id="definition-text" data-pptx-bounds="96 352 392 252">
    <text fill="#1D2430" font-size="22" x="96" y="384">外场 h = 降雨强度</text><text fill="#1D2430" font-size="22" x="96" y="420">响应 = ⟨ln F⟩ 的变化</text><text fill="#1D2430" font-size="22" x="96" y="456">χ = 单位雨强引起的响应</text><text fill="#5B6573" font-size="18" x="96" y="530">同一组实证结果，右边是五个对应；</text><text fill="#5B6573" font-size="18" x="96" y="558">后面三个初探都是新做的，</text><text fill="#5B6573" font-size="18" x="96" y="586">未经推敲</text></g>
  <g id="map-heads" data-pptx-bounds="560 164 664 32" font-size="18" font-weight="bold">
