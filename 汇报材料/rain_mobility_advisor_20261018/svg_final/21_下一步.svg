    <text fill="#FFFFFF" font-size="30" font-weight="bold" x="64" y="324">降雨是一个弱而普遍的</text><text fill="#FFFFFF" font-size="30" font-weight="bold" x="64" y="370">外场——</text><text fill="#FFFFFF" font-size="30" font-weight="bold" x="64" y="416">想把它的规律</text><text fill="#FFFFFF" font-size="30" font-weight="bold" x="64" y="462">用物理的语言讲清楚</text></g>
